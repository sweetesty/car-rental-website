<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#d92c20" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AUTOGO — rent a car from trusted owners near you, or list your own and start earning."
    />
    <title>AUTOGO — Rent a car, anywhere</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // DEBUG: Find overflowing elements and outline them in red
      window.addEventListener('load', () => {
        setTimeout(() => {
          const docWidth = document.documentElement.clientWidth;
          document.querySelectorAll('*').forEach((el) => {
            const rect = el.getBoundingClientRect();
            if (rect.right > docWidth && el.tagName !== 'HTML' && el.tagName !== 'BODY' && el.tagName !== 'SCRIPT') {
              console.log('OVERFLOWING ELEMENT:', el.tagName, el.className);
              el.style.outline = '5px solid red';
              el.style.outlineOffset = '-5px';
            }
          });
        }, 1000);
      });
    </script>
  </body>
</html>
