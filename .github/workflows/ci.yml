name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `build` runs tsc -b first, so this is the type check AND the bundle.
      - run: npm run build
